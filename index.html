<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#202033"><title>教室鼠鼠大逃亡</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171827;color:#fff;font-family:system-ui,-apple-system,"PingFang SC",sans-serif;display:grid;min-height:100svh;place-items:center;padding:14px}
.game{width:min(100%,900px);background:#24263a;border:1px solid #454963;border-radius:22px;padding:14px;box-shadow:0 20px 60px #0008}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}h1{font-size:clamp(20px,4vw,30px);margin:4px 0}.stats{display:flex;gap:12px;font-weight:800}.pill{background:#373b56;padding:8px 12px;border-radius:12px}
.stage{position:relative;margin-top:12px;overflow:hidden;border-radius:14px;border:2px solid #666b82;aspect-ratio:1.5;background:#ddd}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.overlay{position:absolute;inset:0;background:#121426b8;display:grid;place-items:center;text-align:center;padding:20px}.overlay.hidden{display:none}.panel{background:#292d45ed;border:1px solid #737b9b;border-radius:18px;padding:22px;max-width:390px}.panel h2{margin:0 0 8px;font-size:26px}.panel p{line-height:1.6;color:#e0e4f5}
button{border:0;border-radius:14px;background:#ffd35c;color:#282033;font-weight:900;font-size:17px;padding:12px 22px;cursor:pointer}button:active{transform:scale(.97)}
.controls{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}.pad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px}.pad button{padding:0;font-size:19px;background:#454b6b;color:#fff;touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.hint{font-size:13px;color:#c4c9dc;line-height:1.5;text-align:right}
@media(max-width:520px){.stage{aspect-ratio:1.05}.controls{align-items:center}.hint{max-width:48%}}
</style></head><body><main class="game"><header><h1>🐭 教室鼠鼠大逃亡</h1><div class="stats"><span class="pill">🧀 <b id="score">0</b></span><span class="pill">⏱️ <b id="time">0</b>s</span><span class="pill">🏆 <b id="best">0</b></span></div></header>
<div class="stage"><img id="bg" src="classroom-bg.jpg" alt="教室背景"><canvas id="c"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="headline">鼠鼠，准备好了吗？</h2><p id="message">用方向键或屏幕按钮移动鼠鼠，收集奶酪 🧀，躲开巡逻的老师！坚持越久，速度越快。</p><button id="start">开始游戏</button></div></div></div>
<div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="hint">电脑：方向键 / WASD<br>手机：按住方向按钮<br>目标：吃到奶酪，别被抓住！</div></div></main>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),stage=document.querySelector('.stage');
const $=id=>document.getElementById(id);let W=900,H=600,player,cheese,guards,score=0,seconds=0,running=false,last=0,keys={},best=+(localStorage.getItem('mouseBest')||0),raf;
$('best').textContent=best;
function resize(){const r=stage.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);W=canvas.width;H=canvas.height;draw()}new ResizeObserver(resize).observe(stage);resize();
function rand(a,b){return a+Math.random()*(b-a)}
function placeCheese(){cheese={x:rand(35,W-35),y:rand(35,H-35),r:Math.max(11,W*.018)}}
function init(){score=0;seconds=0;player={x:W*.22,y:H*.75,r:Math.max(16,W*.025),speed:W*.34};guards=[{x:W*.75,y:H*.25,r:W*.035,vx:-W*.13,vy:W*.1},{x:W*.8,y:H*.78,r:W*.03,vx:W*.1,vy:-W*.12}];placeCheese();$('score').textContent=0;$('time').textContent=0}
function drawMouse(x,y,r){ctx.save();ctx.translate(x,y);ctx.fillStyle='#8c8c9e';ctx.beginPath();ctx.arc(-r*.45,-r*.7,r*.42,0,7);ctx.arc(r*.45,-r*.7,r*.42,0,7);ctx.fill();ctx.fillStyle='#f3a8b7';ctx.beginPath();ctx.arc(-r*.45,-r*.7,r*.22,0,7);ctx.arc(r*.45,-r*.7,r*.22,0,7);ctx.fill();ctx.fillStyle='#999aaa';ctx.beginPath();ctx.ellipse(0,0,r*.78,r,0,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-r*.27,-r*.2,r*.17,0,7);ctx.arc(r*.27,-r*.2,r*.17,0,7);ctx.fill();ctx.fillStyle='#161622';ctx.beginPath();ctx.arc(-r*.24,-r*.18,r*.08,0,7);ctx.arc(r*.24,-r*.18,r*.08,0,7);ctx.fill();ctx.fillStyle='#f28a9a';ctx.beginPath();ctx.arc(0,r*.12,r*.13,0,7);ctx.fill();ctx.strokeStyle='#444';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-r*.4,r*.3);ctx.lineTo(-r,r*.2);ctx.moveTo(r*.4,r*.3);ctx.lineTo(r,r*.2);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);if(cheese){ctx.font=Math.max(25,W*.045)+'px serif';ctx.textAlign='center';ctx.fillText('🧀',cheese.x,cheese.y+W*.012)}(guards||[]).forEach(g=>{ctx.font=Math.max(30,W*.05)+'px serif';ctx.textAlign='center';ctx.fillText('👨‍🏫',g.x,g.y+g.r*.55)});if(player)drawMouse(player.x,player.y,player.r)}
function end(){running=false;cancelAnimationFrame(raf);if(score>best){best=score;localStorage.setItem('mouseBest',score);$('best').textContent=best}$('headline').textContent='被老师发现啦！';$('message').textContent='你收集了 '+score+' 块奶酪，坚持了 '+Math.floor(seconds)+' 秒。再来挑战一次吧！';$('start').textContent='再玩一次';$('overlay').classList.remove('hidden')}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.04);last=t;seconds+=dt;$('time').textContent=Math.floor(seconds);
let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(player.r,Math.min(W-player.r,player.x+dx/len*player.speed*dt));player.y=Math.max(player.r,Math.min(H-player.r,player.y+dy/len*player.speed*dt));
guards.forEach(g=>{const factor=1+seconds*.012;g.x+=g.vx*factor*dt;g.y+=g.vy*factor*dt;if(g.x<g.r||g.x>W-g.r)g.vx*=-1;if(g.y<g.r||g.y>H-g.r)g.vy*=-1;let d=Math.hypot(player.x-g.x,player.y-g.y);if(d<player.r+g.r*.65)end()});
if(cheese&&Math.hypot(player.x-cheese.x,player.y-cheese.y)<player.r+cheese.r){score++;$('score').textContent=score;placeCheese()}
draw();if(running)raf=requestAnimationFrame(loop)}
function start(){cancelAnimationFrame(raf);keys={};init();$('overlay').classList.add('hidden');running=true;last=performance.now();raf=requestAnimationFrame(loop)}
$('start').addEventListener('click',start);window.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){keys[map[k]]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{let k=e.key.toLowerCase(),map={arrowup:'up',w:'up',arrowdown:'down',s:'down',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k])keys[map[k]]=false});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[d]=true;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys[d]=false))});draw();
</script></body></html>
